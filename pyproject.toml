[project]
name = "randall-api"
version = "1.0.0"
description = "Backend de Randall, el asistente de Quasar Devs"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "openai>=1.40,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
]

[tool.vercel]
# Vercel carga la app de FastAPI desde app/main.py
entrypoint = "app.main:app"
